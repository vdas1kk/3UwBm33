<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Фильтр подарков</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: var(--tg-theme-bg-color, #18222d);
            --secondary-bg-color: var(--tg-theme-secondary-bg-color, #232e3c);
            --text-color: var(--tg-theme-text-color, #ffffff);
            --hint-color: var(--tg-theme-hint-color, #708499);
            --button-color: var(--tg-theme-button-color, #2ea6ff);
            --button-text-color: var(--tg-theme-button-text-color, #ffffff);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            height: var(--tg-viewport-stable-height, 100vh);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px 16px;
            /* Учет безопасных зон iOS (челка и нижняя полоса) */
            padding-top: calc(env(safe-area-inset-top, 0px) + 20px);
            padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 20px);
        }

        .header {
            margin-bottom: 24px;
        }

        .header h1 {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .header p {
            font-size: 14px;
            color: var(--hint-color);
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--hint-color);
        }

        select, input {
            width: 100%;
            padding: 14px;
            font-size: 16px;
            background-color: var(--secondary-bg-color);
            color: var(--text-color);
            border: 1px solid transparent;
            border-radius: 12px;
            outline: none;
            transition: border-color 0.2s ease;
        }

        select:focus, input:focus {
            border-color: var(--button-color);
        }

        .btn-save {
            width: 100%;
            padding: 16px;
            font-size: 16px;
            font-weight: 600;
            background-color: var(--button-color);
            color: var(--button-text-color);
            border: none;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(46, 166, 255, 0.3);
            transition: opacity 0.2s ease;
        }

        .btn-save:active {
            opacity: 0.8;
        }
    </style>
</head>
<body>
    <div class="content">
        <div class="header">
            <h1>Параметры поиска</h1>
            <p>Укажите критерии для отслеживания недооцененных подарков</p>
        </div>

        <form id="filterForm">
            <div class="form-group">
                <label for="collection">Коллекция подарка</label>
                <select id="collection">
                    <option value="">Все коллекции</option>
                    <option value="delicious cake">Delicious Cake</option>
                    <option value="green star">Green Star</option>
                    <option value="santa hat">Santa Hat</option>
                    <option value="red bow">Red Bow</option>
                    <option value="magic potion">Magic Potion</option>
                </select>
            </div>

            <div class="form-group">
                <label for="model">Желаемая модель</label>
                <input type="text" id="model" placeholder="Например: Gold, Diamond, Ice...">
            </div>

            <div class="form-group">
                <label for="backdrop">Цвет фона</label>
                <input type="text" id="backdrop" placeholder="Например: Midnight Blue, Onyx...">
            </div>
        </form>
    </div>

    <button type="button" class="btn-save" id="saveBtn">Сохранить фильтры</button>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        document.getElementById('saveBtn').addEventListener('click', () => {
            const collection = document.getElementById('collection').value;
            const model = document.getElementById('model').value;
            const backdrop = document.getElementById('backdrop').value;

            const payload = {
                collection: collection,
                model: model,
                backdrop: backdrop
            };

            // Отправка данных боту и закрытие WebApp
            tg.sendData(JSON.stringify(payload));
            tg.close();
        });
    </script>
</body>
</html>
